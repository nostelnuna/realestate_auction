<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>한국 부동산 시크릿 경매</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background-color: #090d16; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .tap-btn { transition: transform 0.1s ease, background-color 0.15s ease; }
    .tap-btn:active { transform: scale(0.97); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="glass sticky top-0 z-30 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-xl">🏙️</span>
      <div>
        <h1 class="font-bold text-sm sm:text-base tracking-tight text-amber-400">부동산 시크릿 경매</h1>
        <p id="headerStatus" class="text-[11px] text-slate-400">대기실</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div id="timerBadge" class="hidden px-2.5 py-1 rounded-full bg-slate-800 border border-amber-500/40 text-amber-300 font-mono text-xs font-bold">00s</div>
      <button onclick="openQrModal()" class="tap-btn px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 border border-slate-700">📱 QR 초대</button>
      <button id="hostAuthBtn" onclick="openHostModal()" class="tap-btn px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-amber-300 border border-amber-500/30">🔐 방장</button>
    </div>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto p-4 space-y-4 pb-24">
    <!-- 입장 화면 -->
    <section id="joinSection" class="glass rounded-2xl p-6 mt-8 space-y-4">
      <div class="text-center space-y-1">
        <div class="text-4xl mb-2">🏛️</div>
        <h2 class="text-xl font-bold text-white">한국 부동산 경매에 입장하세요</h2>
        <p class="text-xs text-slate-400">매 라운드 3개 매물 중 딱 1곳에만 입찰하며, 최고가 낙찰 건물의 금액은 시크릿 처리되며, 동일 금액 중복 시 차순위 단독 입찰자가 낙찰받습니다.</p>
      </div>
      <div class="space-y-3">
        <input id="nicknameInput" type="text" maxlength="16" placeholder="닉네임 입력 (최대 16자)"
          onkeydown="if(event.key==='Enter') joinGame()"
          class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 text-sm" />
        <button onclick="joinGame()" class="tap-btn w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm shadow-lg shadow-amber-500/20">
          입장하기
        </button>
        <p id="joinError" class="text-xs text-rose-400 text-center hidden"></p>
      </div>
    </section>

    <!-- 내 자산 요약 바 -->
    <section id="playerBar" class="hidden glass rounded-2xl p-3.5 space-y-2">
      <div class="flex items-center justify-between">
        <div>
          <span id="myNickname" class="font-bold text-white text-sm"></span>
          <span class="text-[11px] text-slate-400 ml-2">보유 매물 <strong id="myPropCount" class="text-emerald-300">0</strong>채</span>
        </div>
        <div class="text-right">
          <div class="text-[10px] text-slate-400">남은 현금</div>
          <div id="myCash" class="text-lg font-extrabold text-amber-400 font-mono">50.0억</div>
        </div>
      </div>
      <div id="myPropList" class="flex flex-wrap gap-1.5 text-[11px]"></div>
    </section>

    <!-- 방장 컨트롤 패널 -->
    <section id="hostControls" class="hidden glass rounded-2xl p-4 border-amber-500/40 space-y-3">
      <div class="flex items-center justify-between gap-2">
        <span class="text-xs font-bold text-amber-400">👑 방장 제어 패널</span>
        <div class="flex items-center gap-2">
          <button onclick="toggleRankAmounts()" id="idxRankAmtBtn" class="tap-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] font-bold text-slate-300 border border-slate-700">💰 순위 금액 OFF</button>
          <a href="/host" target="_blank" class="text-xs text-sky-400 underline">전광판 ↗</a>
        </div>
      </div>
      <div id="hostLobbyControls" class="flex flex-wrap items-center gap-2">
        <div class="flex items-center gap-1 bg-slate-900 p-1 rounded-lg border border-slate-700">
          <button onclick="selectRounds(5)" id="rBtn5" class="round-opt px-2.5 py-1 rounded text-xs font-bold text-slate-300">5R</button>
          <button onclick="selectRounds(10)" id="rBtn10" class="round-opt px-2.5 py-1 rounded text-xs font-bold text-slate-300">10R</button>
          <button onclick="selectRounds(15)" id="rBtn15" class="round-opt px-2.5 py-1 rounded text-xs font-bold bg-amber-500 text-slate-950">15R</button>
        </div>
        <button onclick="hostStartGame()" class="tap-btn flex-1 py-2 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs">경매 시작</button>
      </div>
      <div id="hostActiveControls" class="hidden grid grid-cols-3 gap-2">
        <button onclick="hostPauseResume()" id="pauseBtn" class="tap-btn py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold">⏸ 일시정지</button>
        <button onclick="hostNextPhase()" class="tap-btn py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-xs font-semibold">⏭ 다음 단계</button>
        <button onclick="hostResetGame()" class="tap-btn py-2 rounded-xl bg-rose-600/80 hover:bg-rose-500 text-xs font-semibold">🔄 초기화</button>
      </div>
    </section>

    <section id="phaseContent" class="hidden space-y-4"></section>
    <section id="liveStatusBox" class="hidden glass rounded-2xl p-3.5 space-y-2"></section>

    <!-- 채팅 -->
    <section id="chatSection" class="hidden glass rounded-2xl p-3.5 space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-amber-300">💬 경매장 채팅</span>
        <span class="text-[11px] text-slate-500">실시간 소통</span>
      </div>
      <div id="chatMessages" class="h-32 overflow-y-auto space-y-1.5 text-xs pr-1"></div>
      <div class="flex gap-2">
        <input id="chatInput" type="text" maxlength="200" placeholder="메시지 입력..."
          onkeydown="if(event.key==='Enter') sendChat()"
          class="flex-1 px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs focus:outline-none focus:border-amber-400" />
        <button onclick="sendChat()" class="tap-btn px-4 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs">전송</button>
      </div>
    </section>
  </main>

  <!-- QR 모달 -->
  <div id="qrModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
    <div class="glass rounded-2xl p-6 max-w-xs w-full text-center space-y-4">
      <h3 class="font-bold text-base text-white">📱 참가자 QR 초대</h3>
      <img id="qrImg" src="" alt="QR Code" class="mx-auto w-52 h-52 rounded-xl bg-white p-2" />
      <p id="qrUrlText" class="text-[11px] text-slate-400 break-all"></p>
      <button onclick="closeQrModal()" class="tap-btn w-full py-2.5 rounded-xl bg-slate-800 text-white text-xs font-bold">닫기</button>
    </div>
  </div>

  <!-- 방장 PIN 모달 -->
  <div id="hostModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
    <div class="glass rounded-2xl p-6 max-w-xs w-full space-y-4">
      <h3 class="font-bold text-base text-white text-center">🔐 방장 인증</h3>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="관리자 PIN 입력"
        onkeydown="if(event.key==='Enter') submitHostPin()"
        class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-center text-white tracking-widest focus:outline-none focus:border-amber-400" />
      <p id="pinError" class="text-xs text-rose-400 text-center hidden"></p>
      <div class="flex gap-2">
        <button onclick="closeHostModal()" class="tap-btn flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">취소</button>
        <button onclick="submitHostPin()" class="tap-btn flex-1 py-2.5 rounded-xl bg-amber-500 text-slate-950 text-xs font-bold">확인</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let myToken = localStorage.getItem('re_player_token') || null;
    let hostToken = localStorage.getItem('re_host_token') || null;
    let isHost = false;
    let showRankAmounts = false;
    let selectedRounds = 15;
    let latestState = null;
    let lastRenderedPhaseKey = null;

    let selectedLotId = null;
    let selectedBidUnits = 50; // 5.0억 (단위 1 = 0.1억)
    let mySubmittedBid = null;
    let chatLogs = [];

    function fmtBillion(units) {
      return `${(units / 10).toFixed(1)}억`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (hostToken) {
        socket.emit('host:auth', { hostToken }, (res) => {
          if (res?.ok) applyHostState();
          else localStorage.removeItem('re_host_token');
        });
      }
      if (myToken) {
        socket.emit('player:join', { token: myToken }, (res) => {
          if (res?.ok) onJoinedSuccess(res);
          else {
            localStorage.removeItem('re_player_token');
            myToken = null;
          }
        });
      }
    });

    function joinGame() {
      const nickname = document.getElementById('nicknameInput').value.trim();
      const errEl = document.getElementById('joinError');
      errEl.classList.add('hidden');
      socket.emit('player:join', { nickname, token: myToken }, (res) => {
        if (!res?.ok) {
          errEl.textContent = res?.error || '입장에 실패했습니다.';
          errEl.classList.remove('hidden');
          return;
        }
        localStorage.setItem('re_player_token', res.token);
        myToken = res.token;
        onJoinedSuccess(res);
      });
    }

    function onJoinedSuccess(res) {
      document.getElementById('joinSection').classList.add('hidden');
      document.getElementById('playerBar').classList.remove('hidden');
      document.getElementById('phaseContent').classList.remove('hidden');
      document.getElementById('liveStatusBox').classList.remove('hidden');
      document.getElementById('chatSection').classList.remove('hidden');
      if (res.myBid) mySubmittedBid = res.myBid;
      chatLogs = res.chatHistory || [];
      renderChat();
      socket.emit('game:request_state');
    }

    function openHostModal() { document.getElementById('hostModal').classList.remove('hidden'); }
    function closeHostModal() { document.getElementById('hostModal').classList.add('hidden'); }
    function submitHostPin() {
      const pin = document.getElementById('pinInput').value;
      const errEl = document.getElementById('pinError');
      errEl.classList.add('hidden');
      socket.emit('host:auth', { pin }, (res) => {
        if (!res?.ok) {
          errEl.textContent = res?.error || '인증 실패';
          errEl.classList.remove('hidden');
          return;
        }
        localStorage.setItem('re_host_token', res.hostToken);
        hostToken = res.hostToken;
        applyHostState();
        closeHostModal();
      });
    }
    function toggleRankAmounts() {
      showRankAmounts = !showRankAmounts;
      const btn = document.getElementById('idxRankAmtBtn');
      if (btn) {
        btn.textContent = showRankAmounts ? '💰 순위 금액 ON' : '💰 순위 금액 OFF';
        btn.className = showRankAmounts
          ? 'tap-btn px-2.5 py-1 rounded-lg bg-amber-500/20 text-[11px] font-bold text-amber-300 border border-amber-400/50'
          : 'tap-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] font-bold text-slate-300 border border-slate-700';
      }
      if (latestState) {
        const me = latestState.players.find((p) => p.token === myToken);
        if (me) renderPhaseMain(latestState, me);
      }
    }

    function applyHostState() {
      isHost = true;
      document.getElementById('hostAuthBtn').textContent = '👑 방장됨';
      document.getElementById('hostControls').classList.remove('hidden');
      lastRenderedPhaseKey = null;
      if (latestState) renderState(latestState);
    }

    async function openQrModal() {
      const modal = document.getElementById('qrModal');
      const targetUrl = `${window.location.origin}/`;
      document.getElementById('qrUrlText').textContent = targetUrl;
      const res = await fetch(`/api/qr?url=${encodeURIComponent(targetUrl)}`);
      const data = await res.json();
      document.getElementById('qrImg').src = data.dataUrl;
      modal.classList.remove('hidden');
    }
    function closeQrModal() { document.getElementById('qrModal').classList.add('hidden'); }

    function selectRounds(n) {
      selectedRounds = n;
      [5, 10, 15].forEach((r) => {
        const btn = document.getElementById(`rBtn${r}`);
        btn.className = r === n
          ? 'round-opt px-2.5 py-1 rounded text-xs font-bold bg-amber-500 text-slate-950'
          : 'round-opt px-2.5 py-1 rounded text-xs font-bold text-slate-300';
      });
    }
    function hostStartGame() {
      socket.emit('host:start_game', { totalRounds: selectedRounds }, (res) => {
        if (!res?.ok) alert(res?.error || '시작할 수 없습니다.');
      });
    }
    function hostPauseResume() { socket.emit('host:pause_resume'); }
    function hostExtendTime() { socket.emit('host:extend_time', { seconds: 30 }); }
    function hostNextPhase() { socket.emit('host:next_phase'); }
    function hostKick(token) { socket.emit('host:kick_player', { targetToken: token }); }
    function hostResetGame() {
      if (confirm('경매를 초기화하고 대기실로 돌아갈까요?')) socket.emit('host:reset_game');
    }

    socket.on('game:tick', ({ timer, paused }) => {
      const badge = document.getElementById('timerBadge');
      badge.classList.remove('hidden');
      badge.textContent = paused ? `⏸ ${timer}s` : `${timer}s`;
    });

    socket.on('player:kicked', () => {
      localStorage.removeItem('re_player_token');
      alert('방장에 의해 퇴장되었습니다.');
      window.location.reload();
    });

    socket.on('chat:message', (msg) => {
      chatLogs.push(msg);
      renderChat();
    });

    socket.on('game:state', (st) => {
      latestState = st;
      renderState(st);
    });

    function renderState(st) {
      const me = st.players.find((p) => p.token === myToken);
      const phaseLabels = {
        LOBBY: '대기실',
        BIDDING: `${st.round}/${st.totalRounds}R · 매물 선택 및 입찰`,
        RESULT: `${st.round}/${st.totalRounds}R · 낙찰 결과 공개`,
        GAME_OVER: '최종 자산 순위 발표',
      };
      document.getElementById('headerStatus').textContent = phaseLabels[st.phase] || st.phase;

      const timerBadge = document.getElementById('timerBadge');
      if (st.phase === 'LOBBY' || st.phase === 'GAME_OVER') {
        timerBadge.classList.add('hidden');
      } else {
        timerBadge.classList.remove('hidden');
        timerBadge.textContent = st.paused ? `⏸ ${st.timer}s` : `${st.timer}s`;
      }

      if (isHost) {
        document.getElementById('hostLobbyControls').classList.toggle('hidden', st.phase !== 'LOBBY');
        document.getElementById('hostActiveControls').classList.toggle('hidden', st.phase === 'LOBBY');
        const pauseBtn = document.getElementById('pauseBtn');
        if (pauseBtn) pauseBtn.textContent = st.paused ? '▶ 재개' : '⏸ 일시정지';
      }

      if (!me) return;

      document.getElementById('myNickname').textContent = me.nickname;
      document.getElementById('myCash').textContent = fmtBillion(me.cash || 0);
      document.getElementById('myPropCount').textContent = me.propertyCount || 0;
      document.getElementById('myPropList').innerHTML = (me.properties || []).map((pr) => `
        <span class="px-2 py-0.5 rounded-lg bg-slate-800 border ${pr.wasSecret ? 'border-purple-500/60 text-purple-300' : 'border-slate-700 text-slate-200'}">
          ${pr.emoji} ${escapeHtml(pr.name)} ${pr.wasSecret ? '🔒' : ''}
        </span>
      `).join('');

      const phaseKey = `${st.phase}_${st.round}_${st.phaseNonce}`;
      if (lastRenderedPhaseKey !== phaseKey) {
        lastRenderedPhaseKey = phaseKey;
        if (st.phase === 'BIDDING') {
          selectedLotId = st.lots[0]?.id || null;
          selectedBidUnits = Math.min(me.cash, 50);
          mySubmittedBid = null;
        }
        renderPhaseMain(st, me);
      } else if (st.phase === 'LOBBY') {
        renderPhaseMain(st, me);
      }

      renderLiveStatus(st);
    }

    function renderPhaseMain(st, me) {
      const box = document.getElementById('phaseContent');
      if (st.phase === 'LOBBY') {
        box.innerHTML = `
          <div class="glass rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="font-bold text-sm text-white">접속 중인 참가자 (${st.players.length}/35)</h3>
              <span class="text-[11px] text-slate-400">1명 이상 시 시작 가능</span>
            </div>
            <div class="flex flex-wrap gap-2">
              ${st.players.map((p) => `
                <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800/90 border border-slate-700 text-xs">
                  <span class="w-2 h-2 rounded-full ${p.connected ? 'bg-emerald-400' : 'bg-rose-400'}"></span>
                  <span class="font-medium text-slate-100">${escapeHtml(p.nickname)}</span>
                  ${isHost ? `<button onclick="hostKick('${p.token}')" class="ml-1 text-rose-400 hover:text-rose-300 font-bold">✕</button>` : ''}
                </div>
              `).join('')}
            </div>
            <div class="p-3 rounded-xl bg-slate-900/70 border border-slate-800 text-[11px] text-slate-400 space-y-1">
              <p class="font-semibold text-amber-300">📜 경매 핵심 규칙</p>
              <p>• 매 라운드 <strong>한국 실제 아파트·주상복합 3개 매물</strong>이 등장하며, <strong>3개 중 딱 1곳</strong>에만 입찰할 수 있습니다.</p>
              <p>• 동일 금액을 써낸 사람이 2명 이상이면 모두 탈락하고 <strong>단독 입찰한 차순위</strong>가 낙찰받으며, 최고 낙찰가 항목은 <strong>낙찰자만 공개되고 금액은 🔒 시크릿</strong> 처리됩니다.</p>
              <p>• 최종 라운드 후 <strong>남은 현금 + 보유 건물 감정가</strong> 합산으로 개인 순위가 결정됩니다.</p>
            </div>
          </div>
        `;
        return;
      }

      if (st.phase === 'BIDDING') {
        renderBiddingView(st, me);
        return;
      }

      if (st.phase === 'RESULT') {
        box.innerHTML = `
          <div class="glass rounded-2xl p-4 space-y-3">
            <h3 class="font-bold text-sm text-emerald-400">🔨 ${st.round}라운드 낙찰 결과</h3>
            <div class="space-y-2.5">
              ${st.lots.map((l) => `
                <div class="p-3.5 rounded-xl ${l.isSecretMasked ? 'bg-purple-950/40 border-purple-500/60' : 'bg-slate-900/85 border-slate-700'} border flex items-center justify-between gap-2">
                  <div>
                    <div class="text-[11px] text-slate-400">${escapeHtml(l.region)} · ${l.type}</div>
                    <div class="font-bold text-sm text-white">${l.emoji} ${escapeHtml(l.name)}</div>
                    <div class="text-xs mt-1 ${l.winnerNickname ? 'text-emerald-300 font-bold' : 'text-slate-400'}">
                      ${!l.winnerNickname ? (l.allTied ? '💥 전원 중복 유찰' : '💨 유찰') : `👤 ${escapeHtml(l.winnerNickname)} ${l.wonByFallback ? '<span class="text-[10px] text-amber-300">(차순위)</span>' : ''}`}
                    </div>
                  </div>
                  <div class="text-right font-mono font-extrabold text-sm ${l.isSecretMasked ? 'text-purple-300' : 'text-amber-400'}">
                    ${!l.winnerNickname ? '-' : l.isSecretMasked ? '🔒 시크릿' : fmtBillion(l.winningBid)}
                  </div>
                </div>
              `).join('')}
            </div>
            <div class="pt-3 border-t border-slate-800 space-y-2">
              <h4 class="font-bold text-xs text-amber-300">📋 지금까지 참가자별 낙찰 매물 현황</h4>
              <div class="space-y-1.5">
                ${st.players.map((p) => {
                  const list = p.wonPropertiesSummary || [];
                  return `
                    <div class="p-2.5 rounded-xl bg-slate-900/80 border border-slate-800 text-xs space-y-1">
                      <div class="font-bold text-white">${escapeHtml(p.nickname)} <span class="text-slate-400 font-normal">(${list.length}채)</span></div>
                      <div class="flex flex-wrap gap-1">
                        ${list.length === 0 ? '<span class="text-[11px] text-slate-500">낙찰 매물 없음</span>' : list.map((pr) => `
                          <span class="px-2 py-0.5 rounded bg-slate-800 border ${pr.wasSecret ? 'border-purple-500/50 text-purple-300' : 'border-slate-700 text-slate-200'} text-[11px]">
                            ${pr.round}R ${pr.emoji} ${escapeHtml(pr.name)}
                          </span>
                        `).join('')}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
            <div class="pt-3 border-t border-slate-800 space-y-2">
              <div class="flex items-center justify-between">
                <h4 class="font-bold text-xs text-emerald-300">🏅 ${st.round}라운드 중간 순위</h4>
                <span class="text-[10px] text-slate-400">${isHost && showRankAmounts ? '방장 금액 공개 ON' : '자산 총액 비공개 · 순위만 공개'}</span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                ${(st.rankings || []).map((r) => {
                  const isMe = r.token === myToken;
                  const medal = r.rank === 1 ? '🥇' : r.rank === 2 ? '🥈' : r.rank === 3 ? '🥉' : `${r.rank}위`;
                  const hasAmt = isHost && showRankAmounts && typeof r.totalAsset === 'number';
                  return `
                    <div class="px-3 py-2 rounded-xl ${isMe ? 'bg-emerald-500/20 border-emerald-400' : 'bg-slate-900/80 border-slate-800'} border flex items-center justify-between gap-2 text-xs">
                      <div class="flex items-center gap-2 min-w-0">
                        <span class="font-extrabold w-7 text-center shrink-0">${medal}</span>
                        <span class="font-bold text-white truncate">${escapeHtml(r.nickname)} ${isMe ? '<span class="text-[10px] text-emerald-400">(나)</span>' : ''}</span>
                      </div>
                      ${hasAmt ? `<span class="shrink-0 font-mono text-[11px] font-bold text-amber-300">${fmtBillion(r.totalAsset)}</span>` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (st.phase === 'GAME_OVER') {
        box.innerHTML = `
          <div class="glass rounded-2xl p-4 space-y-4 border-amber-500/40">
            <div class="text-center space-y-1">
              <div class="text-3xl">🏆</div>
              <h3 class="font-bold text-lg text-amber-400">최종 부동산 자산 랭킹</h3>
              <p class="text-xs text-slate-400">남은 현금 + 보유 매물 감정가 합산</p>
            </div>
            <div class="space-y-2">
              ${st.rankings.map((r) => {
                const isMe = r.token === myToken;
                const medal = r.rank === 1 ? '🥇' : r.rank === 2 ? '🥈' : r.rank === 3 ? '🥉' : `${r.rank}위`;
                return `
                  <div class="p-3 rounded-xl ${isMe ? 'bg-amber-500/15 border-amber-400' : 'bg-slate-900/80 border-slate-800'} border flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2.5">
                      <span class="text-base font-extrabold w-8 text-center">${medal}</span>
                      <div>
                        <div class="font-bold text-sm text-white">${escapeHtml(r.nickname)} ${isMe ? '<span class="text-[11px] text-amber-400">(나)</span>' : ''}</div>
                        <div class="text-[11px] text-slate-400">현금 ${fmtBillion(r.cash)} + 부동산 ${fmtBillion(r.propTotal)} (${r.propertyCount}채)</div>
                      </div>
                    </div>
                    <div class="text-right font-mono font-extrabold text-amber-400 text-sm">${fmtBillion(r.totalAsset)}</div>
                  </div>
                `;
              }).join('')}
            </div>
            ${st.secretHistory.length > 0 ? `
              <div class="pt-3 border-t border-slate-800 space-y-1.5">
                <h4 class="text-xs font-bold text-purple-300">🔓 역대 시크릿 매물 정체 공개</h4>
                ${st.secretHistory.map((s) => `
                  <div class="text-xs text-slate-300 bg-purple-950/30 border border-purple-500/30 rounded-lg px-3 py-2">
                    ${s.round}R <strong>${escapeHtml(s.name)}</strong> → <span class="text-amber-300 font-bold">${escapeHtml(s.winnerNickname)}</span> (${fmtBillion(s.winningBid)})
                  </div>
                `).join('')}
              </div>
            ` : ''}
            ${(st.appearedPropertiesRankings && st.appearedPropertiesRankings.length > 0) ? `
              <div class="pt-3 border-t border-slate-800 space-y-2">
                <h4 class="text-xs font-bold text-sky-300">🏢 출품 매물 감정가 순위 (${st.appearedPropertiesRankings.length}곳)</h4>
                <div class="space-y-1.5 max-h-80 overflow-y-auto pr-1">
                  ${st.appearedPropertiesRankings.map((p) => `
                    <div class="px-3 py-2 rounded-xl bg-slate-900/85 border border-slate-800 flex items-center justify-between gap-2 text-xs">
                      <div class="min-w-0">
                        <div class="font-bold text-white truncate"><span class="text-amber-300 mr-1">${p.rank}위</span> ${p.emoji} ${escapeHtml(p.name)}</div>
                        <div class="text-[10px] text-slate-400">${p.round}R · ${escapeHtml(p.region)} · ${p.winnerNickname ? `낙찰: ${escapeHtml(p.winnerNickname)} (${fmtBillion(p.winningBid)})` : '유찰'}</div>
                      </div>
                      <div class="shrink-0 font-mono font-bold text-sky-300">${fmtBillion(p.appraisal)}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }
    }

    function renderBiddingView(st, me) {
      const box = document.getElementById('phaseContent');
      const submittedLot = mySubmittedBid ? st.lots.find((l) => l.id === mySubmittedBid.lotId) : null;
      const isDirty = mySubmittedBid && (mySubmittedBid.lotId !== selectedLotId || mySubmittedBid.amount !== selectedBidUnits);
      box.innerHTML = `
        <div class="glass rounded-2xl p-4 space-y-4">
          <div>
            <h3 class="font-bold text-sm text-amber-400 mb-2">1️⃣ ${st.round}라운드 매물 3곳 중 1곳 선택</h3>
            <div class="space-y-2">
              ${st.lots.map((l) => {
                const selected = l.id === selectedLotId;
                return `
                  <button onclick="pickLot('${l.id}')" class="tap-btn w-full text-left p-3.5 rounded-xl border ${selected ? 'bg-amber-500/20 border-amber-400' : 'bg-slate-900/80 border-slate-700'}">
                    <div class="flex items-center justify-between text-[11px]">
                      <span class="px-2 py-0.5 rounded bg-sky-500/15 text-sky-300 font-semibold">📍 ${escapeHtml(l.region)} · ${l.type}</span>
                    </div>
                    <div class="font-bold text-base text-white mt-1">${l.emoji} ${escapeHtml(l.name)}</div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <h3 class="font-bold text-sm text-white">2️⃣ 입찰 금액 설정</h3>
              <span class="font-mono font-extrabold text-xl text-amber-400">${fmtBillion(selectedBidUnits)}</span>
            </div>
            <div class="grid grid-cols-4 gap-1.5 mb-3">
              <button onclick="adjustBid(-50)" class="tap-btn py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-xs font-bold text-rose-300 border border-slate-700">-5억</button>
              <button onclick="adjustBid(-10)" class="tap-btn py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-xs font-bold text-rose-300 border border-slate-700">-1억</button>
              <button onclick="adjustBid(-5)" class="tap-btn py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-xs font-bold text-rose-300 border border-slate-700">-0.5억</button>
              <button onclick="adjustBid(-1)" class="tap-btn py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-xs font-bold text-rose-300 border border-slate-700">-0.1억</button>
              <button onclick="adjustBid(1)" class="tap-btn py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold">+0.1억</button>
              <button onclick="adjustBid(5)" class="tap-btn py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold">+0.5억</button>
              <button onclick="adjustBid(10)" class="tap-btn py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold">+1억</button>
              <button onclick="adjustBid(50)" class="tap-btn py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold">+5억</button>
              <button onclick="setBidMax()" class="tap-btn col-span-2 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-amber-300">올인</button>
              <button onclick="setBidZero()" class="tap-btn col-span-2 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-400">포기(0)</button>
            </div>
            <button onclick="submitBid()" class="tap-btn w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-amber-500/20">
              ${mySubmittedBid ? '입찰 수정하기' : '비밀 입찰 확정'}
            </button>
            ${mySubmittedBid ? `
              <p class="text-xs text-emerald-400 text-center mt-2 font-semibold">
                ✅ 현재 확정된 입찰: ${submittedLot ? escapeHtml(submittedLot.name) : ''} · ${fmtBillion(mySubmittedBid.amount)}
              </p>
              ${isDirty ? '<p class="text-[11px] text-amber-300 text-center mt-1">※ 선택하신 변경사항은 위 [입찰 수정하기] 버튼을 눌러야 반영됩니다.</p>' : ''}
            ` : ''}
          </div>
        </div>
      `;
    }

    function pickLot(lotId) {
      selectedLotId = lotId;
      const me = latestState?.players.find((p) => p.token === myToken);
      if (latestState && me) renderBiddingView(latestState, me);
    }

    function adjustBid(delta) {
      const me = latestState?.players.find((p) => p.token === myToken);
      if (!me) return;
      selectedBidUnits = Math.min(me.cash, Math.max(0, selectedBidUnits + delta));
      renderBiddingView(latestState, me);
    }

    function setBidMax() {
      const me = latestState?.players.find((p) => p.token === myToken);
      if (!me) return;
      selectedBidUnits = Math.floor(me.cash);
      renderBiddingView(latestState, me);
    }

    function setBidZero() {
      selectedBidUnits = 0;
      const me = latestState?.players.find((p) => p.token === myToken);
      if (me) renderBiddingView(latestState, me);
    }

    function submitBid() {
      socket.emit('bid:submit', { lotId: selectedLotId, amount: selectedBidUnits }, (res) => {
        if (!res?.ok) {
          alert(res?.error || '입찰 실패');
          return;
        }
        mySubmittedBid = res.bid;
        const me = latestState?.players.find((p) => p.token === myToken);
        if (me) renderBiddingView(latestState, me);
      });
    }

    function renderLiveStatus(st) {
      const box = document.getElementById('liveStatusBox');
      if (st.phase === 'LOBBY' || st.phase === 'GAME_OVER') {
        box.classList.add('hidden');
        return;
      }
      box.classList.remove('hidden');
      const bidCount = st.players.filter((p) => p.hasBid).length;
      box.innerHTML = `
        <div class="flex items-center justify-between text-xs">
          <span class="font-bold text-slate-300">참가자 현황 (${st.players.length}명)</span>
          ${st.phase === 'BIDDING' ? `<span class="text-amber-400 font-bold">입찰 완료 ${bidCount}/${st.players.length}</span>` : ''}
        </div>
        <div class="flex flex-wrap gap-1.5">
          ${st.players.map((p) => `
            <span class="px-2 py-1 rounded-lg text-[11px] border ${p.hasBid && st.phase === 'BIDDING' ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300' : 'bg-slate-900 border-slate-700 text-slate-300'}">
              ${escapeHtml(p.nickname)} ${st.phase === 'BIDDING' && p.hasBid ? '✓' : ''}
              ${isHost ? `<button onclick="hostKick('${p.token}')" class="ml-1 text-rose-400">✕</button>` : ''}
            </span>
          `).join('')}
        </div>
      `;
    }

    function sendChat() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chat:send', { text });
      input.value = '';
    }

    function renderChat() {
      const box = document.getElementById('chatMessages');
      box.innerHTML = chatLogs.map((m) => `
        <div class="leading-snug">
          <span class="text-slate-500 text-[10px]">[${m.time}]</span>
          <span class="font-bold text-amber-300">${escapeHtml(m.sender)}:</span>
          <span class="text-slate-200">${escapeHtml(m.text)}</span>
        </div>
      `).join('');
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
